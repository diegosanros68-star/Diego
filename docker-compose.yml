version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: faga_postgres
    environment:
      POSTGRES_DB: faga_muebleria
      POSTGRES_USER: faga_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - faga-network

  redis:
    image: redis:7-alpine
    container_name: faga_redis
    ports:
      - "6379:6379"
    networks:
      - faga-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: faga_backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://faga_user:${DB_PASSWORD:-postgres}@postgres:5432/faga_muebleria
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - faga-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: faga_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - faga-network

volumes:
  postgres_data:

networks:
  faga-network:
    driver: bridge
